<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- A game is not a document: no pinch zoom, no double-tap zoom, and the canvas may use the notch area. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#241d4a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Astralis Tails">
    <!-- Tools/publish-build.sh replaces this token with a hash of the payloads, so a bug report names its build. -->
    <meta name="astra-build" content="dacc16dfa9e4">
    <!-- Readable version of the same thing, for a player wondering whether the phone picked up the new build. -->
    <meta name="astra-build-label" content="ui-rework-3.0 build 298.029">
    <title>Astralis Tails</title>
    <link rel="icon" href="TemplateData/icon.jpg">
    <link rel="apple-touch-icon" href="TemplateData/icon.jpg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="astra-card">
            <div id="astra-title">Astralis Tails</div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
            <div id="astra-progress-text">Loading&hellip;</div>
            <div id="astra-hint">The first visit downloads about 15&nbsp;MB. After that it opens from this device.</div>
            <div id="astra-build-label"></div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var progressText = document.querySelector("#astra-progress-text");
      var buildLabel = document.querySelector("#astra-build-label");
      var warningBanner = document.querySelector("#unity-warning");

      // Publish writes the branch and build number into the meta tag above; a build straight from the editor still has
      // the token, and a token is not a build name, so the card shows nothing rather than "ui-rework-3.0 build 298.029".
      var labelText = (document.querySelector('meta[name="astra-build-label"]') || {}).content || "";
      if (labelText.indexOf("__ASTRA") === 0 || !labelText) {
        buildLabel.style.display = "none";
      } else {
        buildLabel.textContent = labelText;
      }

      // Shows a temporary ribbon for a warning, or a permanent one for an error. An error is the end of the page's
      // usefulness, so it carries the reload that a phone cannot offer without hunting for the URL bar.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type == "error") {
          div.className = "astra-error";
          var reload = document.createElement("button");
          reload.type = "button";
          reload.className = "astra-reload";
          reload.textContent = "Reload";
          reload.onclick = function () { clearStoredBuild().then(function () { location.reload(); }); };
          div.appendChild(reload);
        } else {
          if (type == "warning") div.className = "astra-warning";
          setTimeout(function () {
            if (div.parentNode) div.parentNode.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // A build whose payloads were cached in halves across a publish stays broken however often the page is reloaded:
      // the bad copy is the one on the device. Drop the caches and the worker, then load once more from the network.
      function clearStoredBuild() {
        var work = [];
        if (window.caches) {
          work.push(
            caches.keys().then(function (names) {
              return Promise.all(
                names.map(function (name) {
                  return name.indexOf("astralis-tails-") === 0 ? caches.delete(name) : null;
                })
              );
            })
          );
        }
        if (navigator.serviceWorker) {
          work.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(
                registrations.map(function (registration) { return registration.unregister(); })
              );
            })
          );
        }
        return Promise.all(work).catch(function () { /* nothing stored is not a reason to stay broken */ });
      }

      var buildUrl = "Build";
      // Every payload URL carries the build stamp. The filenames are the same in every build, so without it a browser
      // or a service worker can answer from the ten minutes GitHub's cache header allows and pair one build's data
      // with another build's wasm; WebAssembly then dies with "indirect call signature mismatch" on the first call.
      var buildStamp = (document.querySelector('meta[name="astra-build"]') || {}).content || "";
      function buildFile(name) { return buildUrl + "/" + name + "?b=" + encodeURIComponent(buildStamp); }
      var loaderUrl = buildFile("AstralsTailsIdleLifeWebGL.loader.js");
      var config = {
        arguments: [],
        dataUrl: buildFile("AstralsTailsIdleLifeWebGL.data.unityweb"),
        frameworkUrl: buildFile("AstralsTailsIdleLifeWebGL.framework.js.unityweb"),
        codeUrl: buildFile("AstralsTailsIdleLifeWebGL.wasm.unityweb"),
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "Drawkcin Entertainment",
        productName: "Astralis Tails",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // How many device pixels the canvas is drawn at for every CSS pixel. A phone asks for two or three; the third
      // costs over half again the pixels of the second and is spent on a screen too small to show the difference, so
      // it is frame budget spent on nothing. Two is the ceiling here - lower it if a phone still cannot hold a frame.
      //
      // The engine reads this in JS_SystemInfo_GetPreferredDevicePixelRatio, which is what sizes the canvas; the HUD
      // then divides out whatever ratio the canvas really got, so the two cannot disagree (AstraBrowser.jslib).
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          if (progress < 1) {
            loadingContainer.style.display = "flex";
            progressBarFull.style.width = (100 * progress).toFixed(0) + "%";
            progressText.textContent = "Loading " + (100 * progress).toFixed(0) + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        })
          .then(function (unityInstance) {
          })
          .catch(function (message) {
            unityShowBanner(message, "error");
          });
      };
      script.onerror = function () {
        unityShowBanner("Could not load the game files. Check the connection and reload.", "error");
      };
      document.body.appendChild(script);

      // Keeping the payloads on the device is what makes a second visit open instead of download. The worker keys its
      // cache on the build stamp above, so a new build replaces the old cache rather than mixing two builds together.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("ServiceWorker.js", { updateViaCache: "none" }).catch(function () {
            // A worker needs a secure origin. Opened from a file:// path it will not register, and the page still runs.
          });
        });
      }
    </script>
  </body>
</html>
